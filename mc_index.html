<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Ready</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#f4f5f7; color:#24292f; }
  @media (prefers-color-scheme: dark) { body { background:#14181f; color:#d6dae0; } }
  .card { max-width:520px; padding:48px 40px; text-align:center; }
  .dot { width:10px; height:10px; border-radius:50%; background:#2da44e; display:inline-block;
         margin-right:8px; box-shadow:0 0 0 4px rgba(45,164,78,.15); }
  h1 { font-size:20px; font-weight:600; margin:12px 0 8px; letter-spacing:.3px; }
  p  { font-size:14px; line-height:1.7; margin:6px 0; opacity:.75; }
  code { font-family: ui-monospace, Consolas, monospace; font-size:12.5px;
         background:rgba(127,127,127,.12); padding:2px 7px; border-radius:5px; }
  hr { border:0; border-top:1px solid rgba(127,127,127,.18); margin:26px 30px; }
  footer { font-size:12px; opacity:.45; margin-top:22px; }
</style>
</head>
<body>
<div class="card">
  <span class="dot"></span><span>All systems operational</span>
  <h1>Server is up and running</h1>
  <p>This machine hosts a personal development environment and a few small services.</p>
  <hr>
  <p>For service inquiries, please contact the administrator by email.</p>
  <footer><code>v6 / native dual-stack</code> &nbsp;&middot;&nbsp; powered by a small box somewhere</footer>
</div>
</body>
</html>
